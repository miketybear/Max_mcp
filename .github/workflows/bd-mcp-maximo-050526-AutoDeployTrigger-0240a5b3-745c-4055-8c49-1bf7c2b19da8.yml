name: Trigger auto deployment for bd-mcp-maximo-050526

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/bd-mcp-maximo-050526-AutoDeployTrigger-0240a5b3-745c-4055-8c49-1bf7c2b19da8.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BDMCPMAXIMO050526_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BDMCPMAXIMO050526_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BDMCPMAXIMO050526_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: biendong.azurecr.io
          registryUsername: ${{ secrets.BDMCPMAXIMO050526_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BDMCPMAXIMO050526_REGISTRY_PASSWORD }}
          containerAppName: bd-mcp-maximo-050526
          resourceGroup: AzureAIResources
          imageToBuild: biendong.azurecr.io/bd-mcp-maximo-050526:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


